<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ATMOSPHERE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a1e33;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;touch-action:none;font-family:sans-serif}
  canvas{display:block;border-radius:4px}
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
const C = document.getElementById('g');
const X = C.getContext('2d');
const W = 480, H = 720;

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  C.width = W; C.height = H;
  C.style.width = (W * s) + 'px';
  C.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ═══ PHYSICS ═══
const GRAV = 0.38;
const JUMP = -12;
const MAXSPD = 7.5;
const ACC = 0.42;
const GFRIC = 0.88;
const AFRIC = 0.975;

// ═══ CHUNK SYSTEM ═══
const CHUNK_W = 400;
const CHUNK_H = 300;
const chunks = new Map();

function chunkKey(cx, cy) { return cx + ',' + cy; }

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xFFFFFFFF;
    return (s >>> 0) / 0xFFFFFFFF;
  };
}

function generateChunk(cx, cy) {
  const key = chunkKey(cx, cy);
  if (chunks.has(key)) return;

  const seed = cx * 73856093 + cy * 19349663;
  const rng = seededRandom(seed);

  const worldX = cx * CHUNK_W;
  const worldY = cy * CHUNK_H;
  const altitude = -worldY;

  const density = Math.max(1, Math.floor(2.5 - altitude / 25000));
  const sizeScale = Math.max(0.45, 1 - altitude / 40000);

  const cloudList = [];
  for (let i = 0; i < density; i++) {
    const cw = (100 + rng() * 90) * sizeScale;
    const cwx = worldX + rng() * (CHUNK_W - cw);
    const cwy = worldY + 40 + rng() * (CHUNK_H - 80);
    const type = rng() < 0.04 ? 'boost' : 'normal';
    cloudList.push(createCloud(cwx, cwy, cw, type, rng));
  }

  const bgList = [];
  for (let i = 0; i < 3; i++) {
    const bw = 80 + rng() * 200;
    bgList.push({
      wx: worldX + rng() * CHUNK_W,
      wy: worldY + rng() * CHUNK_H,
      w: bw, depth: 0.15 + rng() * 0.4,
      puffs: makePuffs(bw, rng, 0.7)
    });
  }

  let balloon = null;
  if (rng() < 0.08 && altitude > 0) {
    const cols = ['#FF6B8A','#FFD93D','#6BCB77','#4D96FF','#FF8B3D','#C77DFF','#45D9A8','#FF4D6D'];
    balloon = {
      wx: worldX + rng() * CHUNK_W,
      wy: worldY + rng() * CHUNK_H,
      depth: 0.3 + rng() * 0.3,
      c1: cols[Math.floor(rng() * cols.length)],
      c2: cols[Math.floor(rng() * cols.length)],
      phase: rng() * Math.PI * 2
    };
  }

  chunks.set(key, { clouds: cloudList, bg: bgList, balloon });
}

function makePuffs(w, rng, scale) {
  if (scale === undefined) scale = 1;
  const puffs = [];
  const n = Math.max(5, Math.floor(w / 12));
  for (let i = 0; i < n; i++) {
    const t = (i + 0.3 + rng() * 0.4) / n;
    const x = t * w;
    const edge = Math.min(t, 1 - t) * 2;
    const r = (16 + edge * 18 + rng() * 10) * scale;
    puffs.push({ x: x, y: -r * 0.45 - rng() * 4, r: r });
  }
  return puffs;
}

let cloudUID = 0;
function createCloud(wx, wy, w, type, rng) {
  return {
    wx: wx, wy: wy, w: w, h: 16, id: cloudUID++,
    type: type, puffs: makePuffs(w, rng)
  };
}

// ═══ STARS ═══
const stars = [];
for (let i = 0; i < 500; i++) {
  stars.push({
    x: Math.random() * 3, y: Math.random() * 3,
    s: Math.random() * 2.5 + 0.3,
    b: Math.random(), tw: Math.random() * 0.02 + 0.004,
    hue: Math.random() < 0.15 ? (Math.random() * 60 + 200) : 0
  });
}

// ═══ STATE ═══
let state = 'menu', fc = 0;
let P, cam, score, highScore = 0, combo, comboTimer, maxCombo;
let particles, popups, shake, lastCloudId;
let peakAltitude = 0;

function init() {
  cloudUID = 0;
  chunks.clear();
  cloudCache.clear();

  const startY = 200;
  P = {
    wx: W / 2, wy: startY - 34,
    w: 24, h: 32,
    vx: 0, vy: 0,
    grounded: true, facing: 1,
    jumpHeld: true, frame: 0,
    squash: 1, capeAng: 0, trail: [],
    sparkles: []
  };

  cam = { x: P.wx - W / 2, y: P.wy - H * 0.5 };
  score = 0; combo = 0; comboTimer = 0; maxCombo = 0;
  peakAltitude = 0;
  particles = []; popups = [];
  shake = 0; lastCloudId = -1;

  const startRng = seededRandom(42);
  const startCloud = createCloud(W / 2 - 110, startY, 220, 'start', startRng);

  const startCX = Math.floor(P.wx / CHUNK_W);
  const startCY = Math.floor(P.wy / CHUNK_H);
  for (let dy = -3; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      generateChunk(startCX + dx, startCY + dy);
    }
  }

  const sKey = chunkKey(startCX, Math.floor(startY / CHUNK_H));
  if (chunks.has(sKey)) {
    chunks.get(sKey).clouds.push(startCloud);
  }
}

// ═══ INPUT ═══
let keys = {};
window.addEventListener('keydown', function(e) {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (state === 'menu') { state = 'playing'; init(); }
  if (state === 'gameover' && (e.code === 'Space' || e.code === 'KeyR')) { state = 'playing'; init(); }
});
window.addEventListener('keyup', function(e) { keys[e.code] = false; });

let tL = false, tR = false, tJ = false;
C.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (state === 'menu') { state = 'playing'; init(); return; }
  if (state === 'gameover') { state = 'playing'; init(); return; }
  for (let ti = 0; ti < e.changedTouches.length; ti++) {
    const t = e.changedTouches[ti];
    const r = C.getBoundingClientRect();
    const x = (t.clientX - r.left) / r.width;
    const y = (t.clientY - r.top) / r.height;
    if (y < 0.4) tJ = true;
    else if (x < 0.35) tL = true;
    else if (x > 0.65) tR = true;
    else tJ = true;
  }
}, { passive: false });
C.addEventListener('touchend', function(e) { e.preventDefault(); tL = tR = tJ = false; }, { passive: false });

function kL() { return keys.ArrowLeft || keys.KeyA || tL; }
function kR() { return keys.ArrowRight || keys.KeyD || tR; }
function kJ() { return keys.Space || keys.ArrowUp || keys.KeyW || tJ; }

// ═══ EFFECTS ═══
function emit(x, y, n, col, sp) {
  if (!sp) sp = 3;
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * sp,
      vy: Math.random() * -sp * 0.8 - 0.5,
      life: 1, decay: 0.014 + Math.random() * 0.02,
      sz: 2 + Math.random() * 4, col: col
    });
  }
}

function addPopup(wx, wy, txt, col) {
  popups.push({ wx: wx, wy: wy, txt: txt, col: col, life: 1.3, vy: -1.5 });
}

// ═══ SKY ═══
function skyRGB(alt) {
  const S = [
    [0,    148, 218, 255],
    [3000, 135, 208, 252],
    [6000, 120, 195, 248],
    [10000, 95, 172, 238],
    [16000, 70, 135, 210],
    [22000, 50, 95, 180],
    [30000, 32, 58, 130],
    [40000, 18, 30, 75],
    [55000, 8, 14, 40],
    [75000, 3, 4, 15]
  ];
  let i = 0;
  while (i < S.length - 1 && alt > S[i + 1][0]) i++;
  if (i >= S.length - 1) return S[S.length - 1];
  const a = S[i], b = S[i + 1];
  const t = (alt - a[0]) / (b[0] - a[0]);
  return [0, a[1] + (b[1] - a[1]) * t | 0, a[2] + (b[2] - a[2]) * t | 0, a[3] + (b[3] - a[3]) * t | 0];
}

function atmoLabel(alt) {
  if (alt < 6000) return 'TROPOSPHERE';
  if (alt < 16000) return 'STRATOSPHERE';
  if (alt < 28000) return 'MESOSPHERE';
  if (alt < 45000) return 'THERMOSPHERE';
  return 'EXOSPHERE';
}

// ═══ UPDATE ═══
function update() {
  if (state !== 'playing') return;
  fc++;

  const pcx = Math.floor(P.wx / CHUNK_W);
  const pcy = Math.floor(P.wy / CHUNK_H);
  for (let dy = -4; dy <= 2; dy++) {
    for (let dx = -3; dx <= 3; dx++) {
      generateChunk(pcx + dx, pcy + dy);
    }
  }

  for (const [key] of chunks) {
    const parts = key.split(',');
    const cx = Number(parts[0]);
    const cy = Number(parts[1]);
    if (Math.abs(cx - pcx) > 5 || cy - pcy > 4 || pcy - cy > 6) {
      chunks.delete(key);
    }
  }

  // Movement
  const air = !P.grounded;
  if (kL()) { P.vx -= ACC * (air ? 0.6 : 1); P.facing = -1; }
  if (kR()) { P.vx += ACC * (air ? 0.6 : 1); P.facing = 1; }
  P.vx *= air ? AFRIC : GFRIC;
  if (Math.abs(P.vx) > MAXSPD) P.vx = MAXSPD * Math.sign(P.vx);
  if (Math.abs(P.vx) < 0.04) P.vx = 0;
  P.wx += P.vx;

  // Jump
  if (kJ() && P.grounded && !P.jumpHeld) {
    let jp = JUMP;
    const spd = Math.abs(P.vx) / MAXSPD;
    jp *= (1 + spd * 0.65);
    jp *= (1 + Math.min(combo, 25) * 0.03);
    P.vy = jp;
    P.grounded = false;
    P.jumpHeld = true;
    P.squash = 1.4;
    emit(P.wx + P.w / 2, P.wy + P.h, 12, 'rgba(255,255,255,0.7)', 3.5);
  }
  if (!kJ()) P.jumpHeld = false;

  P.vy += GRAV;
  P.wy += P.vy;
  P.squash += (1 - P.squash) * 0.12;

  // Cape physics
  const cTarget = -P.vx * 0.1 + (P.vy < -2 ? 0.4 : P.vy > 5 ? -0.3 : 0);
  P.capeAng += (cTarget - P.capeAng) * 0.07;

  // Trail
  if (Math.abs(P.vy) > 5 || Math.abs(P.vx) > 4) {
    P.trail.push({ x: P.wx + P.w / 2, y: P.wy + P.h / 2, life: 1 });
  }
  P.trail = P.trail.filter(function(t) { t.life -= 0.04; return t.life > 0; });

  // Sparkles for high combo
  if (combo >= 3 && fc % 3 === 0) {
    P.sparkles.push({
      x: P.wx + P.w / 2 + (Math.random() - 0.5) * 30,
      y: P.wy + Math.random() * P.h,
      life: 1, sz: 1 + Math.random() * 2.5
    });
  }
  P.sparkles = P.sparkles.filter(function(s) { s.life -= 0.03; s.y -= 0.5; return s.life > 0; });

  if (Math.abs(P.vx) > 0.5 && P.grounded) P.frame += Math.abs(P.vx) * 0.06;

  // Collision
  P.grounded = false;
  const viewL = cam.x - 50, viewR = cam.x + W + 50;
  const viewT = cam.y - 50, viewB = cam.y + H + 50;

  let landed = false;
  for (const [, chunk] of chunks) {
    if (landed) break;
    for (let ci = 0; ci < chunk.clouds.length; ci++) {
      const cl = chunk.clouds[ci];
      if (cl.wy < viewT || cl.wy > viewB) continue;
      if (cl.wx + cl.w < viewL || cl.wx > viewR) continue;

      const pBot = P.wy + P.h;
      const prevBot = pBot - P.vy;

      if (P.vy >= 0 &&
          P.wx + P.w > cl.wx + 5 && P.wx < cl.wx + cl.w - 5 &&
          prevBot <= cl.wy + 3 &&
          pBot >= cl.wy - 2) {

        P.wy = cl.wy - P.h;
        P.vy = 0;
        P.grounded = true;
        P.squash = 0.72;

        if (cl.id !== lastCloudId) {
          const alt = Math.max(0, Math.floor((200 - cl.wy) * 3.28));
          const ns = Math.max(score, alt);

          if (ns > score) {
            combo++;
            comboTimer = 180;
            if (combo > maxCombo) maxCombo = combo;
            score = ns;

            if (combo >= 2) {
              const pts = combo * 150;
              addPopup(P.wx + P.w / 2, P.wy - 10, '+' + pts,
                combo >= 10 ? '#FFD700' : combo >= 5 ? '#FF6B8A' : '#fff');
              emit(P.wx + P.w / 2, P.wy, 4 + combo * 2,
                combo >= 10 ? '#FFD700' : combo >= 5 ? '#FF6B8A' : '#B8E8FF', 4);
            }
          }

          if (cl.type === 'boost') {
            P.vy = JUMP * 2.3;
            P.grounded = false;
            shake = 10;
            emit(P.wx + P.w / 2, P.wy + P.h, 30, '#FFD700', 7);
            addPopup(P.wx + P.w / 2, P.wy - 20, 'BOOST!', '#FFD700');
          }
          lastCloudId = cl.id;
        }
        landed = true;
        break;
      }
    }
  }

  // Combo timer
  if (comboTimer > 0) comboTimer--; else combo = 0;

  // Track peak
  const curAlt = Math.max(0, Math.floor((200 - P.wy) * 3.28));
  if (curAlt > peakAltitude) peakAltitude = curAlt;

  // Camera
  const tx = P.wx + P.w / 2 - W / 2;
  const ty = P.wy - H * 0.38;
  cam.x += (tx - cam.x) * 0.06;
  if (ty < cam.y) cam.y += (ty - cam.y) * 0.065;
  else if (P.wy > cam.y + H * 0.7) cam.y += (ty - cam.y) * 0.03;

  // Death
  if (P.wy > cam.y + H + 180) {
    state = 'gameover';
    if (score > highScore) highScore = score;
    shake = 14;
  }

  // Update effects
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].wy += popups[i].vy;
    popups[i].life -= 0.013;
    if (popups[i].life <= 0) popups.splice(i, 1);
  }
  if (shake > 0) { shake *= 0.84; if (shake < 0.3) shake = 0; }
}

// ═══ DRAWING ═══

const cloudCache = new Map();

function renderCloudToCache(cl) {
  const key = cl.id;
  if (cloudCache.has(key)) return cloudCache.get(key);

  const pad = 45;
  const cW = cl.w + pad * 2;
  const cH = 100 + pad;
  const oc = document.createElement('canvas');
  oc.width = cW; oc.height = cH;
  const ox = oc.getContext('2d');

  const offX = pad;
  const offY = pad + 30;
  const boost = cl.type === 'boost';

  // Soft outer glow
  ox.fillStyle = boost ? 'rgba(255,240,200,0.18)' : 'rgba(200,230,255,0.2)';
  for (let i = 0; i < cl.puffs.length; i++) {
    const p = cl.puffs[i];
    ox.beginPath();
    ox.arc(offX + p.x, offY + p.y + 5, p.r + 12, 0, Math.PI * 2);
    ox.fill();
  }

  // Shadow underneath
  ox.fillStyle = 'rgba(70,120,170,0.08)';
  ox.beginPath();
  ox.ellipse(offX + cl.w / 2, offY + cl.h + 10, cl.w * 0.45, 12, 0, 0, Math.PI * 2);
  ox.fill();

  // Main flat base
  ox.fillStyle = boost ? '#FFF5D8' : '#EEF5FF';
  const r = cl.h / 2;
  ox.beginPath();
  ox.moveTo(offX + r, offY);
  ox.lineTo(offX + cl.w - r, offY);
  ox.arc(offX + cl.w - r, offY + r, r, -Math.PI / 2, Math.PI / 2);
  ox.lineTo(offX + r, offY + cl.h);
  ox.arc(offX + r, offY + r, r, Math.PI / 2, -Math.PI / 2);
  ox.fill();

  // Puffs - base layer
  ox.fillStyle = boost ? '#FFF8E8' : '#F0F6FF';
  for (let i = 0; i < cl.puffs.length; i++) {
    const p = cl.puffs[i];
    ox.beginPath();
    ox.arc(offX + p.x, offY + p.y + 4, p.r, 0, Math.PI * 2);
    ox.fill();
  }

  // Puffs - bright white highlights (top-left light source)
  for (let i = 0; i < cl.puffs.length; i++) {
    const p = cl.puffs[i];
    const hg = ox.createRadialGradient(
      offX + p.x - p.r * 0.3, offY + p.y + 4 - p.r * 0.35, 0,
      offX + p.x, offY + p.y + 4, p.r
    );
    hg.addColorStop(0, boost ? 'rgba(255,255,245,0.9)' : 'rgba(255,255,255,0.9)');
    hg.addColorStop(0.4, boost ? 'rgba(255,252,235,0.4)' : 'rgba(248,252,255,0.35)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ox.fillStyle = hg;
    ox.beginPath();
    ox.arc(offX + p.x, offY + p.y + 4, p.r, 0, Math.PI * 2);
    ox.fill();
  }

  // Puffs - bottom shading
  for (let i = 0; i < cl.puffs.length; i++) {
    const p = cl.puffs[i];
    const sg = ox.createRadialGradient(
      offX + p.x, offY + p.y + 4 + p.r * 0.5, 0,
      offX + p.x, offY + p.y + 4, p.r
    );
    sg.addColorStop(0, boost ? 'rgba(210,190,120,0.25)' : 'rgba(150,190,230,0.3)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ox.fillStyle = sg;
    ox.beginPath();
    ox.arc(offX + p.x, offY + p.y + 4, p.r, 0, Math.PI * 2);
    ox.fill();
  }

  // Illustrated outline - draw connected cloud contour
  ox.strokeStyle = boost ? 'rgba(170,150,60,0.5)' : 'rgba(80,130,190,0.45)';
  ox.lineWidth = 2.5;
  ox.lineJoin = 'round';
  ox.lineCap = 'round';

  if (cl.puffs.length > 0) {
    ox.beginPath();
    // Start from bottom-left
    ox.moveTo(offX + 3, offY + cl.h);
    ox.lineTo(offX + 3, offY + 6);

    // Arc over each puff creating bumpy top
    for (let i = 0; i < cl.puffs.length; i++) {
      const p = cl.puffs[i];
      const py = offY + p.y + 4;
      const px = offX + p.x;
      ox.arc(px, py, p.r + 1, Math.PI * 1.15, -Math.PI * 0.15);
    }

    // Down to bottom-right
    ox.lineTo(offX + cl.w - 3, offY + 6);
    ox.lineTo(offX + cl.w - 3, offY + cl.h);

    // Flat bottom
    ox.lineTo(offX + 3, offY + cl.h);
    ox.stroke();
  }

  // Bottom line accent
  ox.strokeStyle = boost ? 'rgba(170,150,60,0.35)' : 'rgba(80,130,190,0.3)';
  ox.lineWidth = 2;
  ox.beginPath();
  ox.moveTo(offX, offY + cl.h);
  ox.lineTo(offX + cl.w, offY + cl.h);
  ox.stroke();

  // Small inner detail lines for illustrated feel
  ox.strokeStyle = boost ? 'rgba(200,180,100,0.15)' : 'rgba(120,170,220,0.12)';
  ox.lineWidth = 1;
  for (let i = 1; i < cl.puffs.length; i++) {
    const p0 = cl.puffs[i - 1];
    const p1 = cl.puffs[i];
    const mx = offX + (p0.x + p1.x) / 2;
    const my = offY + Math.max(p0.y, p1.y) + 8;
    ox.beginPath();
    ox.arc(mx, my, Math.min(p0.r, p1.r) * 0.4, Math.PI * 0.1, Math.PI * 0.9);
    ox.stroke();
  }

  cloudCache.set(key, { canvas: oc, offX: pad, offY: pad + 30 });
  return cloudCache.get(key);
}

function drawCloud(cl, alpha) {
  const cached = renderCloudToCache(cl);
  const sx = cl.wx - cam.x - cached.offX;
  const sy = cl.wy - cam.y - cached.offY;

  X.save();
  X.globalAlpha = alpha;

  if (cl.type === 'boost') {
    const gl = 0.4 + 0.6 * Math.sin(fc * 0.07);
    X.shadowColor = '#FFD700';
    X.shadowBlur = 12 + gl * 18;
  }

  X.drawImage(cached.canvas, sx, sy);
  X.restore();
}

function drawCharacter() {
  const sx = P.wx - cam.x;
  const sy = P.wy - cam.y;
  const sY = P.squash, sX = 2 - sY;

  // Sparkles
  for (let i = 0; i < P.sparkles.length; i++) {
    const sp = P.sparkles[i];
    X.save();
    X.globalAlpha = sp.life * 0.7;
    X.fillStyle = combo >= 10 ? '#FFD700' : combo >= 5 ? '#FF8CAA' : '#AAE0FF';
    const spx = sp.x - cam.x;
    const spy = sp.y - cam.y;
    // Draw a 4-pointed star
    X.beginPath();
    const ssz = sp.sz * sp.life;
    X.moveTo(spx, spy - ssz * 2);
    X.lineTo(spx + ssz * 0.5, spy - ssz * 0.5);
    X.lineTo(spx + ssz * 2, spy);
    X.lineTo(spx + ssz * 0.5, spy + ssz * 0.5);
    X.lineTo(spx, spy + ssz * 2);
    X.lineTo(spx - ssz * 0.5, spy + ssz * 0.5);
    X.lineTo(spx - ssz * 2, spy);
    X.lineTo(spx - ssz * 0.5, spy - ssz * 0.5);
    X.closePath();
    X.fill();
    X.restore();
  }

  X.save();
  X.translate(sx + P.w / 2, sy + P.h);
  X.scale(P.facing * sX, sY);
  X.translate(-P.w / 2, -P.h);

  // Cape
  const cLen = 22 + (P.vy < -3 ? 14 : 0);
  const w1 = Math.sin(fc * 0.1) * 5;
  const w2 = Math.sin(fc * 0.14 + 1) * 3;
  X.save();
  X.translate(P.w / 2, 12);
  X.rotate(P.capeAng + Math.sin(fc * 0.065) * 0.08);

  const cCol = combo >= 10 ? ['#FFD700', '#FF8C00'] :
    combo >= 5 ? ['#EE3355', '#AA1133'] :
    ['#2A7888', '#1A4E5A'];
  const cg = X.createLinearGradient(0, 0, -P.facing * cLen * 0.5, cLen);
  cg.addColorStop(0, cCol[0]);
  cg.addColorStop(1, cCol[1]);
  X.fillStyle = cg;

  X.beginPath();
  X.moveTo(-4, -2);
  X.bezierCurveTo(
    -P.facing * cLen * 0.3 + w1, cLen * 0.15,
    -P.facing * cLen * 0.65 + w2, cLen * 0.45,
    -P.facing * cLen * 0.4 + w1 * 1.2, cLen
  );
  X.lineTo(-P.facing * cLen * 0.15 + w1 * 0.5, cLen * 0.9);
  X.bezierCurveTo(
    -P.facing * cLen * 0.1, cLen * 0.5,
    -P.facing * cLen * 0.05, cLen * 0.2,
    6, -2
  );
  X.fill();

  // Cape edge highlight
  X.strokeStyle = cCol[0];
  X.globalAlpha = 0.5;
  X.lineWidth = 1.5;
  X.beginPath();
  X.moveTo(-4, -2);
  X.bezierCurveTo(
    -P.facing * cLen * 0.3 + w1, cLen * 0.15,
    -P.facing * cLen * 0.65 + w2, cLen * 0.45,
    -P.facing * cLen * 0.4 + w1 * 1.2, cLen
  );
  X.stroke();
  X.globalAlpha = 1;
  X.restore();

  // Robe body
  const rg = X.createLinearGradient(4, 10, 10, 32);
  rg.addColorStop(0, '#3D8E9E');
  rg.addColorStop(0.5, '#2D7080');
  rg.addColorStop(1, '#205A68');
  X.fillStyle = rg;
  X.beginPath();
  X.moveTo(6, 12);
  X.lineTo(3, 28);
  X.quadraticCurveTo(5, 32, 9, 30);
  X.lineTo(12, 26);
  X.lineTo(15, 30);
  X.quadraticCurveTo(19, 32, 21, 28);
  X.lineTo(18, 12);
  X.closePath();
  X.fill();

  // Robe dark fold
  X.fillStyle = 'rgba(0,30,40,0.18)';
  X.beginPath();
  X.moveTo(13, 13); X.lineTo(12, 26); X.lineTo(15, 30);
  X.quadraticCurveTo(19, 32, 21, 28); X.lineTo(18, 12);
  X.closePath();
  X.fill();

  // Robe outline
  X.strokeStyle = 'rgba(20,60,70,0.45)';
  X.lineWidth = 1.3;
  X.beginPath();
  X.moveTo(6, 12); X.lineTo(3, 28); X.quadraticCurveTo(5, 32, 9, 30);
  X.lineTo(12, 26); X.lineTo(15, 30); X.quadraticCurveTo(19, 32, 21, 28);
  X.lineTo(18, 12);
  X.stroke();

  // Hood
  X.fillStyle = '#2D7A8A';
  X.beginPath();
  X.arc(12, 10, 11, 0, Math.PI * 2);
  X.fill();

  // Hood rim
  X.fillStyle = '#1E5E6E';
  X.beginPath();
  X.arc(12, 10, 11, 0.4, Math.PI - 0.4);
  X.fill();

  // Hood point
  X.fillStyle = '#2D7A8A';
  X.beginPath();
  X.moveTo(4, 2);
  X.quadraticCurveTo(11, -9, 16, 0);
  X.lineTo(18, 6);
  X.quadraticCurveTo(11, 4, 4, 2);
  X.fill();
  X.strokeStyle = 'rgba(20,60,70,0.3)';
  X.lineWidth = 1;
  X.beginPath();
  X.moveTo(4, 2);
  X.quadraticCurveTo(11, -9, 16, 0);
  X.stroke();

  // Face
  X.fillStyle = '#F2DEC8';
  X.beginPath();
  X.arc(14, 11, 6, -0.5, Math.PI * 0.75);
  X.fill();

  // Eye
  X.fillStyle = '#151525';
  X.beginPath();
  X.arc(15, 10, 2.2, 0, Math.PI * 2);
  X.fill();

  // Eye shine
  X.fillStyle = '#fff';
  X.beginPath();
  X.arc(15.6, 9.2, 0.9, 0, Math.PI * 2);
  X.fill();

  // Mouth when jumping
  if (!P.grounded && P.vy < -3) {
    X.fillStyle = '#C08878';
    X.beginPath();
    X.ellipse(14.5, 14, 1.5, 1, 0, 0, Math.PI);
    X.fill();
  }

  // Combo glow aura
  if (combo >= 3) {
    const gc = combo >= 10 ? 'rgba(255,215,0,' : combo >= 5 ? 'rgba(255,107,138,' : 'rgba(150,220,255,';
    const gAmt = 0.12 + Math.sin(fc * 0.08) * 0.06;
    X.fillStyle = gc + gAmt + ')';
    X.beginPath();
    X.ellipse(12, 16, 18 + combo * 0.5, 22 + combo * 0.5, 0, 0, Math.PI * 2);
    X.fill();
  }

  X.restore();
}

function drawBalloon(sx, sy, c1, c2) {
  X.save();
  // Basket
  X.fillStyle = '#8B6E14';
  X.fillRect(sx - 5, sy + 28, 10, 7);
  X.strokeStyle = '#6B5010';
  X.lineWidth = 0.8;
  X.strokeRect(sx - 5, sy + 28, 10, 7);
  // Ropes
  X.strokeStyle = '#999';
  X.lineWidth = 0.5;
  X.beginPath();
  X.moveTo(sx - 5, sy + 28); X.lineTo(sx - 10, sy + 10);
  X.moveTo(sx + 5, sy + 28); X.lineTo(sx + 10, sy + 10);
  X.stroke();
  // Balloon
  const bg = X.createRadialGradient(sx - 4, sy - 5, 3, sx, sy, 17);
  bg.addColorStop(0, '#fff');
  bg.addColorStop(0.3, c1);
  bg.addColorStop(0.7, c2);
  bg.addColorStop(1, c1);
  X.fillStyle = bg;
  X.beginPath();
  X.ellipse(sx, sy, 15, 22, 0, 0, Math.PI * 2);
  X.fill();
  // Highlight
  X.fillStyle = 'rgba(255,255,255,0.35)';
  X.beginPath();
  X.ellipse(sx - 4, sy - 6, 4, 9, 0.3, 0, Math.PI * 2);
  X.fill();
  X.strokeStyle = 'rgba(0,0,0,0.12)';
  X.lineWidth = 1;
  X.beginPath();
  X.ellipse(sx, sy, 15, 22, 0, 0, Math.PI * 2);
  X.stroke();
  X.restore();
}

function drawEarth() {
  const baseY = 200;
  const earthScreenY = baseY - cam.y + 140;
  if (earthScreenY < -600 || earthScreenY > H + 400) return;

  X.save();
  const cx = W / 2 - (cam.x - W / 2) * 0.01;
  const ey = earthScreenY + 950;

  // Atmospheric glow rings
  const ag = X.createRadialGradient(cx, ey, 750, cx, ey, 1100);
  ag.addColorStop(0, 'rgba(100,195,255,0)');
  ag.addColorStop(0.85, 'rgba(100,195,255,0.05)');
  ag.addColorStop(0.92, 'rgba(120,210,255,0.08)');
  ag.addColorStop(1, 'rgba(100,195,255,0)');
  X.fillStyle = ag;
  X.fillRect(0, Math.max(0, earthScreenY - 100), W, H);

  // Earth sphere
  X.beginPath();
  X.ellipse(cx, ey, 1400, 980, 0, 0, Math.PI * 2);
  const eg = X.createLinearGradient(0, earthScreenY, 0, earthScreenY + 280);
  eg.addColorStop(0, '#8CC8E8');
  eg.addColorStop(0.03, '#5CB5DD');
  eg.addColorStop(0.12, '#3A9BD0');
  eg.addColorStop(0.45, '#2275A8');
  eg.addColorStop(1, '#185888');
  X.fillStyle = eg;
  X.fill();

  // Rim glow
  X.strokeStyle = 'rgba(180,230,255,0.45)';
  X.lineWidth = 4;
  X.beginPath();
  X.ellipse(cx, ey, 1400, 980, 0, -Math.PI * 0.33, -Math.PI * 0.67, true);
  X.stroke();

  // Inner rim glow
  X.strokeStyle = 'rgba(200,240,255,0.2)';
  X.lineWidth = 8;
  X.beginPath();
  X.ellipse(cx, ey, 1396, 976, 0, -Math.PI * 0.35, -Math.PI * 0.65, true);
  X.stroke();

  // Horizon clouds
  X.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 16; i++) {
    const hx = ((i * 120 + 20 - cam.x * 0.2) % (W + 500)) - 250;
    const hy = earthScreenY + 6 + Math.sin(i * 2.3) * 12;
    X.beginPath();
    X.ellipse(hx, hy, 55 + Math.sin(i * 2.7) * 25, 8, 0, 0, Math.PI * 2);
    X.fill();
  }
  X.restore();
}

// ═══ DOODLE DECORATIONS ═══
// These appear at higher altitudes like the reference night-sky image
function drawDoodles(altitude) {
  if (altitude < 20000) return;

  const doodleAlpha = Math.min(0.7, (altitude - 20000) / 30000);
  X.save();
  X.globalAlpha = doodleAlpha;

  const t = fc * 0.015;

  // Top-left: skull and crossbones
  drawSkull(18, 95 + Math.sin(t * 0.7) * 3);

  // Top-right: rocket
  drawRocket(W - 38, 95 + Math.sin(t * 0.9 + 1) * 3);

  // Bottom-left: lightning bolt
  drawLightning(30, H - 55 + Math.sin(t * 0.8 + 2) * 3);

  // Bottom-right: star with rainbow
  drawDoodleStar(W - 40, H - 50 + Math.sin(t * 0.6 + 3) * 3);

  // Cassette tape top-right area
  if (altitude > 30000) {
    drawCassette(W - 65, 48 + Math.sin(t * 0.5) * 2);
  }

  X.restore();
}

function drawSkull(x, y) {
  X.save();
  X.strokeStyle = '#7BF178';
  X.fillStyle = '#7BF178';
  X.lineWidth = 2;
  // Skull shape
  X.beginPath();
  X.arc(x, y - 6, 12, Math.PI, 0);
  X.lineTo(x + 12, y + 2);
  X.lineTo(x + 8, y + 8);
  X.lineTo(x + 4, y + 5);
  X.lineTo(x, y + 8);
  X.lineTo(x - 4, y + 5);
  X.lineTo(x - 8, y + 8);
  X.lineTo(x - 12, y + 2);
  X.closePath();
  X.stroke();
  // Eyes
  X.beginPath();
  X.arc(x - 5, y - 4, 3, 0, Math.PI * 2);
  X.arc(x + 5, y - 4, 3, 0, Math.PI * 2);
  X.fill();
  // Crossbones
  X.beginPath();
  X.moveTo(x - 16, y + 12); X.lineTo(x + 16, y + 24);
  X.moveTo(x + 16, y + 12); X.lineTo(x - 16, y + 24);
  X.stroke();
  X.restore();
}

function drawRocket(x, y) {
  X.save();
  X.strokeStyle = '#FF8B3D';
  X.fillStyle = '#FF8B3D';
  X.lineWidth = 2;
  // Body
  X.beginPath();
  X.moveTo(x, y - 16);
  X.lineTo(x + 7, y);
  X.lineTo(x + 5, y + 10);
  X.lineTo(x - 5, y + 10);
  X.lineTo(x - 7, y);
  X.closePath();
  X.stroke();
  // Window
  X.beginPath();
  X.arc(x, y - 2, 3, 0, Math.PI * 2);
  X.stroke();
  // Flames
  X.strokeStyle = '#FFD700';
  X.beginPath();
  X.moveTo(x - 3, y + 10);
  X.lineTo(x, y + 18);
  X.lineTo(x + 3, y + 10);
  X.stroke();
  // Stars around
  X.fillStyle = '#FFD700';
  X.font = '8px sans-serif';
  X.fillText('*', x + 12, y - 8);
  X.fillText('*', x - 14, y + 4);
  X.restore();
}

function drawLightning(x, y) {
  X.save();
  X.strokeStyle = '#FFD93D';
  X.fillStyle = '#FFD93D';
  X.lineWidth = 2.5;
  X.beginPath();
  X.moveTo(x + 4, y - 14);
  X.lineTo(x - 4, y);
  X.lineTo(x + 2, y);
  X.lineTo(x - 6, y + 14);
  X.stroke();
  // Small stars
  X.font = '10px sans-serif';
  X.fillText('*', x + 10, y - 8);
  X.fillText('*', x - 12, y + 8);
  X.restore();
}

function drawDoodleStar(x, y) {
  X.save();
  X.strokeStyle = '#FFD93D';
  X.fillStyle = '#FFD93D';
  X.lineWidth = 2;
  // 5-pointed star
  X.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (i * 4 * Math.PI / 5) - Math.PI / 2;
    const r = i % 2 === 0 ? 12 : 5;
    const method = i === 0 ? 'moveTo' : 'lineTo';
    X[method](x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  X.closePath();
  X.stroke();
  // Rainbow arc
  const colors = ['#FF4D4D', '#FF8B3D', '#FFD93D', '#6BCB77', '#4D96FF', '#C77DFF'];
  for (let i = 0; i < colors.length; i++) {
    X.strokeStyle = colors[i];
    X.lineWidth = 1.5;
    X.beginPath();
    X.arc(x + 16, y + 8, 8 + i * 2, Math.PI, Math.PI * 1.5);
    X.stroke();
  }
  X.restore();
}

function drawCassette(x, y) {
  X.save();
  X.strokeStyle = '#AAA';
  X.lineWidth = 1.5;
  // Body
  X.strokeRect(x - 14, y - 8, 28, 16);
  // Reels
  X.beginPath();
  X.arc(x - 5, y, 4, 0, Math.PI * 2);
  X.arc(x + 5, y, 4, 0, Math.PI * 2);
  X.stroke();
  // Label area
  X.strokeRect(x - 10, y - 6, 20, 6);
  // Rainbow accent
  X.strokeStyle = '#FF6B8A';
  X.lineWidth = 1;
  X.beginPath();
  X.moveTo(x - 14, y + 10);
  X.lineTo(x + 14, y + 10);
  X.stroke();
  X.restore();
}

// ═══ VIGNETTE / BORDER for high altitude ═══
function drawBorder(altitude) {
  if (altitude < 18000) return;
  const ba = Math.min(0.6, (altitude - 18000) / 30000);

  X.save();
  // Dark vignette border
  const vg = X.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.min(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,' + (ba * 0.4) + ')');
  X.fillStyle = vg;
  X.fillRect(0, 0, W, H);

  // Subtle border frame
  X.strokeStyle = 'rgba(100,100,100,' + (ba * 0.3) + ')';
  X.lineWidth = 3;
  X.strokeRect(4, 4, W - 8, H - 8);
  X.restore();
}

// ═══ MAIN DRAW ═══
function draw() {
  const altitude = Math.max(0, -(cam.y - 200) * 3.28);

  X.save();
  if (shake > 0) X.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // Sky gradient
  const sg = X.createLinearGradient(0, 0, 0, H);
  const s1 = skyRGB(altitude + 800);
  const s2 = skyRGB(Math.max(0, altitude - 800));
  sg.addColorStop(0, 'rgb(' + s1[1] + ',' + s1[2] + ',' + s1[3] + ')');
  sg.addColorStop(1, 'rgb(' + s2[1] + ',' + s2[2] + ',' + s2[3] + ')');
  X.fillStyle = sg;
  X.fillRect(0, 0, W, H);

  // Stars
  const sA = Math.max(0, Math.min(1, (altitude - 10000) / 12000));
  if (sA > 0) {
    for (let i = 0; i < stars.length; i++) {
      const st = stars[i];
      const sx = ((st.x * W - cam.x * 0.015) % W + W) % W;
      const sy = ((st.y * H * 1000 + cam.y * 0.03) % H + H) % H;
      const twinkle = 0.4 + 0.6 * Math.sin(fc * st.tw + st.x * 99);
      X.globalAlpha = sA * twinkle * (0.3 + st.b * 0.7);
      if (st.hue > 0) {
        X.fillStyle = 'hsl(' + st.hue + ',60%,85%)';
      } else {
        X.fillStyle = '#FFFEF0';
      }
      X.beginPath();
      X.arc(sx, sy, st.s, 0, Math.PI * 2);
      X.fill();

      // Cross sparkle on bright stars
      if (st.s > 1.8 && twinkle > 0.7) {
        X.globalAlpha *= 0.3;
        X.fillRect(sx - st.s * 2, sy - 0.3, st.s * 4, 0.6);
        X.fillRect(sx - 0.3, sy - st.s * 2, 0.6, st.s * 4);
      }
    }
    X.globalAlpha = 1;
  }

  // Earth
  drawEarth();

  // BG clouds & balloons from chunks
  for (const [, chunk] of chunks) {
    for (let i = 0; i < chunk.bg.length; i++) {
      const bc = chunk.bg[i];
      const bsx = bc.wx - cam.x * bc.depth;
      const bsy = bc.wy - cam.y + (cam.y * bc.depth);
      if (bsy < -100 || bsy > H + 100 || bsx < -250 || bsx > W + 250) continue;
      const a = Math.max(0.04, 0.2 - altitude / 80000);
      X.save();
      X.globalAlpha = a;
      X.fillStyle = altitude > 25000 ? 'rgba(200,215,240,0.4)' : 'rgba(235,245,255,0.6)';
      for (let j = 0; j < bc.puffs.length; j++) {
        const p = bc.puffs[j];
        X.beginPath();
        X.arc(bsx + p.x, bsy + p.y, p.r, 0, Math.PI * 2);
        X.fill();
      }
      X.restore();
    }

    if (chunk.balloon) {
      const bl = chunk.balloon;
      const bsx = bl.wx - cam.x * bl.depth;
      const bsy = bl.wy - cam.y + cam.y * bl.depth;
      if (bsy > -60 && bsy < H + 60) {
        const bob = Math.sin(fc * 0.011 + bl.phase) * 6;
        drawBalloon(bsx, bsy + bob, bl.c1, bl.c2);
      }
    }
  }

  // Platform clouds
  for (const [, chunk] of chunks) {
    for (let ci = 0; ci < chunk.clouds.length; ci++) {
      const cl = chunk.clouds[ci];
      const sx = cl.wx - cam.x;
      const sy = cl.wy - cam.y;
      if (sy < -80 || sy > H + 80 || sx < -230 || sx > W + 230) continue;
      const clAlt = Math.max(0, (200 - cl.wy) * 3.28);
      const a = Math.max(0.45, 1 - clAlt / 55000);
      drawCloud(cl, a);
    }
  }

  if (state === 'playing' || state === 'gameover') {
    // Trail
    for (let i = 0; i < P.trail.length; i++) {
      const t = P.trail[i];
      X.globalAlpha = t.life * 0.35;
      X.fillStyle = combo >= 10 ? '#FFD700' : combo >= 5 ? '#FF6B8A' : '#B0DFFF';
      X.beginPath();
      X.arc(t.x - cam.x, t.y - cam.y, 3.5 * t.life, 0, Math.PI * 2);
      X.fill();
    }
    X.globalAlpha = 1;

    // Particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      X.globalAlpha = p.life;
      X.fillStyle = p.col;
      X.beginPath();
      X.arc(p.x - cam.x, p.y - cam.y, p.sz * p.life, 0, Math.PI * 2);
      X.fill();
    }
    X.globalAlpha = 1;

    // Player
    drawCharacter();

    // Popups
    for (let i = 0; i < popups.length; i++) {
      const pp = popups[i];
      X.save();
      X.globalAlpha = Math.min(1, pp.life);
      const sz = 18 + Math.max(0, (1.3 - pp.life)) * 6;
      X.font = 'bold ' + sz + 'px "Courier New",monospace';
      X.textAlign = 'center';
      const px = pp.wx - cam.x;
      const py = pp.wy - cam.y;
      X.strokeStyle = 'rgba(0,0,0,0.4)';
      X.lineWidth = 3.5;
      X.strokeText(pp.txt, px, py);
      X.fillStyle = pp.col;
      X.fillText(pp.txt, px, py);
      X.restore();
    }

    // ── HUD ──
    const dark = altitude > 20000;
    const hc = dark ? 'rgba(255,255,255,0.95)' : 'rgba(15,40,65,0.92)';
    const hc2 = dark ? 'rgba(255,255,255,0.5)' : 'rgba(15,40,65,0.45)';
    const hShadow = dark ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.5)';

    // Height (right)
    X.textAlign = 'right';
    X.font = 'bold 11px "Courier New",monospace';
    X.fillStyle = hc2;
    X.fillText('HEIGHT', W - 14, 22);

    X.font = 'bold 30px "Courier New",monospace';
    X.strokeStyle = hShadow;
    X.lineWidth = 3;
    X.strokeText(score.toLocaleString() + ' FT', W - 14, 54);
    X.fillStyle = hc;
    X.fillText(score.toLocaleString() + ' FT', W - 14, 54);

    if (highScore > 0) {
      X.font = 'bold 12px "Courier New",monospace';
      X.fillStyle = '#DDA020';
      X.fillText('\u2605 BEST ' + highScore.toLocaleString() + ' FT', W - 14, 72);
    }

    // Combo (left)
    if (combo >= 2) {
      const ca = Math.min(1, comboTimer / 30);
      X.textAlign = 'left';
      X.globalAlpha = ca;

      const comboSz = 24 + Math.min(combo, 12);
      X.font = 'bold ' + comboSz + 'px "Courier New",monospace';
      X.strokeStyle = 'rgba(0,0,0,0.3)';
      X.lineWidth = 3.5;
      X.strokeText('COMBO ' + combo, 14, 40);
      X.fillStyle = hc;
      X.fillText('COMBO ' + combo, 14, 40);

      X.font = 'bold 20px "Courier New",monospace';
      const comboCol = combo >= 10 ? '#FFD700' : combo >= 5 ? '#FF6B8A' : hc;
      X.strokeStyle = 'rgba(0,0,0,0.25)';
      X.lineWidth = 3;
      X.strokeText('+' + (combo * 150), 14, 64);
      X.fillStyle = comboCol;
      X.fillText('+' + (combo * 150), 14, 64);
      X.globalAlpha = 1;
    }

    // Atmosphere label
    X.textAlign = 'right';
    X.font = '10px "Courier New",monospace';
    X.fillStyle = hc2;
    X.fillText(atmoLabel(altitude), W - 14, highScore > 0 ? 88 : 72);

    // Speed indicator
    const spd = Math.abs(P.vx) / MAXSPD;
    if (spd > 0.3) {
      X.textAlign = 'left';
      X.font = '9px "Courier New",monospace';
      X.fillStyle = hc2;
      const barW = 50;
      X.fillText('SPD', 14, H - 20);
      X.fillStyle = hc2;
      X.fillRect(38, H - 27, barW, 5);
      X.fillStyle = spd > 0.8 ? '#FFD700' : spd > 0.5 ? '#FF8B3D' : '#6BCB77';
      X.fillRect(38, H - 27, barW * spd, 5);
    }
  }

  // Border / doodles at high altitude
  drawBorder(altitude);
  drawDoodles(altitude);

  X.restore();

  // ═══ OVERLAYS ═══
  if (state === 'menu') {
    X.fillStyle = 'rgba(5,25,50,0.35)';
    X.fillRect(0, 0, W, H);
    X.textAlign = 'center';

    // Title shadow
    X.fillStyle = 'rgba(0,0,0,0.35)';
    X.font = 'bold 44px "Courier New",monospace';
    X.fillText('ATMOSPHERE', W / 2 + 2, H / 2 - 58);
    // Title
    X.fillStyle = '#fff';
    X.fillText('ATMOSPHERE', W / 2, H / 2 - 60);

    X.font = '12px "Courier New",monospace';
    X.fillStyle = 'rgba(255,255,255,0.4)';
    X.fillText('E N D L E S S   A S C E N T', W / 2, H / 2 - 32);

    if (Math.sin(fc * 0.05) > -0.3) {
      X.font = '18px "Courier New",monospace';
      X.fillStyle = 'rgba(255,255,255,0.9)';
      X.fillText('PRESS SPACE TO LAUNCH', W / 2, H / 2 + 25);
    }

    X.font = '11px "Courier New",monospace';
    X.fillStyle = 'rgba(255,255,255,0.4)';
    X.fillText('\u2190 \u2192 MOVE  |  SPACE JUMP', W / 2, H / 2 + 62);
    X.fillText('Build speed for higher jumps', W / 2, H / 2 + 82);
    X.fillText('Chain landings for combos', W / 2, H / 2 + 100);

    if (highScore > 0) {
      X.fillStyle = '#DDA020';
      X.fillText('\u2605 BEST: ' + highScore.toLocaleString() + ' FT', W / 2, H / 2 + 130);
    }
  }

  if (state === 'gameover') {
    X.fillStyle = 'rgba(0,8,18,0.6)';
    X.fillRect(0, 0, W, H);
    X.textAlign = 'center';

    X.font = 'bold 30px "Courier New",monospace';
    X.fillStyle = '#FF6B8A';
    X.strokeStyle = 'rgba(0,0,0,0.3)';
    X.lineWidth = 3;
    X.strokeText('LOST IN THE VOID', W / 2, H / 2 - 55);
    X.fillText('LOST IN THE VOID', W / 2, H / 2 - 55);

    X.font = 'bold 28px "Courier New",monospace';
    X.fillStyle = '#fff';
    X.strokeText(score.toLocaleString() + ' FT', W / 2, H / 2 - 10);
    X.fillText(score.toLocaleString() + ' FT', W / 2, H / 2 - 10);

    X.font = '14px "Courier New",monospace';
    X.fillStyle = 'rgba(255,255,255,0.6)';
    X.fillText('Max Combo: \u00d7' + maxCombo, W / 2, H / 2 + 20);
    X.fillText('Best: ' + highScore.toLocaleString() + ' FT', W / 2, H / 2 + 44);
    X.fillStyle = 'rgba(255,255,255,0.3)';
    X.fillText(atmoLabel(score), W / 2, H / 2 + 66);

    if (score > 0 && score >= highScore) {
      X.fillStyle = '#FFD700';
      X.font = 'bold 14px "Courier New",monospace';
      X.fillText('\u2605 NEW RECORD! \u2605', W / 2, H / 2 + 86);
    }

    if (Math.sin(fc * 0.05) > -0.3) {
      X.font = '16px "Courier New",monospace';
      X.fillStyle = 'rgba(255,255,255,0.8)';
      X.fillText('PRESS SPACE TO RETRY', W / 2, H / 2 + 115);
    }
  }
}

// Menu animation
function menuUpdate() {
  fc++;
  if (state === 'menu') {
    if (!chunks.size) {
      cam = { x: 0, y: -2000 };
      const pcx = Math.floor(cam.x / CHUNK_W);
      const pcy = Math.floor(cam.y / CHUNK_H);
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          generateChunk(pcx + dx, pcy + dy);
        }
      }
    }
    cam.y -= 0.3;
  }
}

function loop() {
  menuUpdate();
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
